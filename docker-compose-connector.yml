version: '3.9'
services:

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - 6333:6333
      - 6334:6334
    expose:
      - 6333
      - 6334
      - 6335
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped
    environment:
      QDRANT__LOG_LEVEL: "INFO"

  indexer:
    build: 
      context: ./indexer
      dockerfile: Dockerfile
      args:
        EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID}
        EMBEDDING_SIZE: ${EMBEDDING_SIZE}
    volumes:
      - ${LOCAL_FILES_PATH}:/usr/src/app/local_files/
      - ./indexer:/usr/src/app
      - ./indexer_data:/indexer/storage
    #user: "82:82" #image not build for this :/
    ports:
      - 8001:8000
    environment:
      - PYTHONPATH=/usr/src
      - PYTHONUNBUFFERED=TRUE
      - LOCAL_FILES_PATH=${LOCAL_FILES_PATH}
      - EMBEDDING_MODEL_ID=${EMBEDDING_MODEL_ID}
      - EMBEDDING_SIZE=${EMBEDDING_SIZE}
      - CONTAINER_PATH=/usr/src/app/local_files/
    restart: unless-stopped
    depends_on:
      - qdrant

  linker:
    build: ./linker
    volumes:
      - ./linker:/usr/src/app
    ports:
      - 8002:8000
    environment:
      - PYTHONPATH=/usr/src
      - PYTHONUNBUFFERED=TRUE
      - FIRESTORE_COLLECTION_NAME=userTasks
      - TASKS_COLLECTION=tasks
      - USER_ID=${USER_ID}
      - PASSWORD=${PASSWORD}
      - FB_PROJECT=localragex
    depends_on:
      - qdrant
    restart: unless-stopped
    profiles:
      - donotstart
      
  connector:
    build: ./connector
    volumes:
      - ./connector:/usr/src/app
    ports:
      - 8004:8000
    env_file:
      - .env
    environment:
      - PYTHONPATH=/usr/src
      - PYTHONUNBUFFERED=TRUE
      - INDEXER_BASE=http://indexer:8000
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://bastapiprompting.ils-geomonitoring.de}
      - CONNECTOR_AUTH=none
    restart: unless-stopped
    depends_on:
      - indexer

  webdav:
    image: bytemark/webdav:latest
    container_name: webdav
    ports:
      - 127.0.0.1:8080:80
    volumes:
      - ${LOCAL_FILES_PATH}/..:/var/lib/dav
    env_file:
      - .env
    environment:
      - AUTH_TYPE=Digest
      - USERNAME=${WEBDAV_USER}
      - PASSWORD=${WEBDAV_PASS}
      - LOCATION=/webdav/
    restart: unless-stopped
    # keep this service optional for compose profiles if you don't want it started by default
  
